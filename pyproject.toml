[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facebook-mcp"
version = "0.1.0"
description = "Facebook MCP server: latest post time lookup, keyword search (people/pages), and Messenger messaging"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "facebook", "automation", "scraping", "messenger", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.2,<2",
    "curl_cffi>=0.9",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "websockets>=12",       # test_m4_cdp_integration spins up a mock DevTools server
    "cryptography>=42",     # tools/import_cookies.py (Chrome v10 decryption)
]

[project.scripts]
facebook-mcp = "facebook_mcp.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]
ignore = [
    "E501",   # long lines are handled by the formatter
    "RUF001", # ambiguous unicode: Chinese/typographic punctuation is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001", "SIM105"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facebook_mcp = ["routes/templates/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
